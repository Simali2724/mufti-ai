# Render.com deployment blueprint
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: mufti-ai
    runtime: docker
    plan: free
    envVars:
      - key: GOOGLE_API_KEY
        sync: false          # Must be set manually in Render dashboard
      - key: DEPLOY_MODE
        value: cloud
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: LLM_PROVIDER_ORDER
        value: gemini
      - key: PORT
        value: 10000         # Render's default port
